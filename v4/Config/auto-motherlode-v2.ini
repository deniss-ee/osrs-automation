[Meta]
schemaVersion=1

[Tunables]
; ============================================================
; Runner + phase timing (global cadence)
; ============================================================
; Engine tick interval (ms). Lower = more responsive, more CPU.
runnerTickMs=50
; Force-stop if "mine" makes no progress for this long (ms).
phaseTimeoutMine=180000
; Shared timeout for clearRed/clearYellow (matches legacy).
phaseTimeoutBank=30000
; Separate timeout for withdrawSack/depositBank - kept apart from
; phaseTimeoutBank so it doesn't cut off their own longer internal
; wait failsafes (sackWaitTimeoutMs, bankImageWaitTimeoutMs) early.
phaseTimeoutSack=90000
; Separate timeout for returnMine1/returnMine2, same reason as
; phaseTimeoutSack - set above their own internal wait timeouts.
phaseTimeoutReturn=60000

; ============================================================
; Detection tuning shared across phases
; ============================================================
; Per-channel color match tolerance for the vein search.
colorTolerance=20
; Pixels of movement between ticks still counted as "stable" for
; any TargetLock-based phase (mine/clearRed/clearYellow).
targetLockMoveTolerancePx=2

; ============================================================
; Mine phase (search/click loop)
; ============================================================
; Consecutive stable ticks before a found vein counts as "arrived".
mineStableTicks=2
; Min time (ms) between clicks on a stable, locked vein.
clickCooldownMs=1500
; Click offset (px) applied after the vein block's center is found -
; shifts the click onto the actual rock if it's off from center.
veinClickOffsetX=0
veinClickOffsetY=0
; 1 = scan the vein region bottom-up instead of top-down. Flip this
; if clicks land in the overlay but miss the actual rock.
mineScanBottomUp=0
; While walking to a not-yet-stable vein, re-click after this long
; (ms) if it still hasn't stabilized - prevents getting stuck.
walkReclickTimeoutMs=3000
; Delay (ms) between mouse-move and click - lets the client register
; hover before the click fires, or it can land as a plain tile click.
clickSettleMs=100
; +/- percent jitter on clickSettleMs/ctrlHoldSettleMs (capped 100ms,
; floored 30ms).
clickSettleJitterPercent=10
; Delay (ms) after pressing Ctrl (runMode=1) before releasing it.
ctrlHoldSettleMs=50
; Vein search region (top-left/bottom-right). Recalibrate if the
; window moves or the mining spot changes.
mineRegionX1=1068
mineRegionY1=672
mineRegionX2=1438
mineRegionY2=842
; Vein overlay colors (light/dark variant) - both searched each tick.
veinColorLight=0x00FF00
veinColorDark=0x00CE00
; Min solid block size (px) to count as a real vein, not noise.
mineBlockW=25
mineBlockH=25
; Half-width (px) of the re-search box around a locked vein.
mineTrackBoxRadiusPx=50
; Reference point used to pick between two simultaneous veins
; (whichever is closer). Defaults to screen center.
referencePointX=960
referencePointY=540

; ============================================================
; ClearRed phase (rockfall clearing, blocks the hopper walkway)
; ============================================================
; Rockfall overlay color, searched across the whole screen.
redColor=0xFF0000
redTolerance=0
; Min solid block size (px) to count as a real rockfall.
redBlockW=25
redBlockH=25
; Half-width (px) of the re-search box around a locked rockfall.
redTrackBoxRadiusPx=200
; Consecutive stable ticks before "arrived" (now clearing it).
redStableTicks=2
; Min time (ms) between clicks on a stable, locked rockfall.
redClearCooldownMs=6000

; ============================================================
; ClearYellow phase (depositing ore into the hopper)
; ============================================================
; Ore hopper color, searched across the whole screen.
yellowColor=0xFFFF00
yellowTolerance=12
; Min solid block size (px) to count as the hopper.
yellowBlockW=22
yellowBlockH=22
; Stable ticks needed before clicking - 0 means instantly stable.
yellowStableTicks=0
; Min time (ms) between hopper clicks - long, to let the walk-in +
; deposit animation finish before clicking again.
yellowClickCooldownMs=15000
; One-time delay (ms) before the first hopper click - without this
; the click fires as fast as the very first search resolves.
yellowEntryDelayMs=100

; ============================================================
; WithdrawSack phase (running to the sack and withdrawing)
; ============================================================
; Fixed click point for the ore sack.
sackRunX=1825
sackRunY=724
; One-time delay (ms) before the first sack click, letting the
; hopper-drop animation finish.
sackPreClickDelayMs=800
; Min time (ms) between sack re-clicks (failsafe, not a cadence).
sackReclickCooldownMs=12000
; Max time (ms) to wait for items before stopping cleanly.
sackWaitTimeoutMs=60000

; ============================================================
; DepositBank phase (opening the deposit box, depositing all)
; ============================================================
; Deposit-container marker color, searched across the whole screen.
bankColor=0xFF00FF
bankTolerance=0
bankBlockW=24
bankBlockH=24
; One-time delay (ms) before clicking the container - without this
; it can be clicked instantly, before the character finishes walking.
bankPreClickDelayMs=300
; Calibrated anchor for the "Deposit All" button image
; (v4/Images/deposit-motherlode.png, 80x72px), padded by
; bankImageSearchPaddingPx to build the search region.
bankImageAnchorX=775
bankImageAnchorY=765
bankImageSearchPaddingPx=20
; Max time (ms) to wait for the deposit box to appear before
; stopping cleanly.
bankImageWaitTimeoutMs=15000
; ImageSearch poll interval (ms) while waiting.
bankImagePollMs=100

; ============================================================
; ReturnMine1 phase (bank -> mine, step 1)
; ============================================================
; Fixed click point for this leg's waypoint.
return1ClickX=699
return1ClickY=1279
; Orange arrival marker, searched in a region padded around this point.
return1MarkerX=1321
return1MarkerY=678
return1MarkerW=21
return1MarkerH=21
return1MarkerColor=0xFFFF00
return1MarkerTolerance=0
; Padding (px) around the marker point to build the search region.
return1MarkerSearchPaddingPx=50
; Min time (ms) between re-clicks while waiting for the marker.
return1ReclickCooldownMs=12000
; Max time (ms) to wait for the marker before stopping cleanly.
return1WaitTimeoutMs=30000
; One-time delay (ms) after seeing the marker, before moving on -
; without this the next waypoint gets clicked instantly.
return1PostMarkerDelayMs=100

; ============================================================
; ReturnMine2 phase (bank -> mine, step 2 + final approach click)
; ============================================================
; Fixed click point for stage 1's waypoint.
return2ClickX=1251
return2ClickY=1354
; Orange marker for stage 1's arrival.
return2MarkerX=1303
return2MarkerY=433
return2MarkerW=21
return2MarkerH=21
return2MarkerColor=0xFFFF00
return2MarkerTolerance=0
return2MarkerSearchPaddingPx=50
; Min time (ms) between re-clicks while waiting for the marker.
return2ReclickCooldownMs=12000
; Max time (ms) to wait for the marker before stopping cleanly.
return2WaitTimeoutMs=30000
; One-time delay (ms) after seeing the marker, before the final click.
return2PostMarkerDelayMs=100
; Fixed final click that puts the character on the mining spot.
return2FinalClickX=1491
return2FinalClickY=993
; Delay (ms) after the final click before handing off to "mine".
return2AfterClickWaitMs=2500

[Settings]
; Hold Ctrl (force-run) while clicking. 1 = on, 0 = off.
runMode=1
; Indicator slot used to infer inventory full/empty.
indicatorSlot=28
; Second slot required alongside indicatorSlot for "full" - gems can
; sit in slot 28 without being hoppered, so 28 alone can't be trusted.
secondaryIndicatorSlot=27
; Two slots checked with OR logic for "sack gave us something" -
; a gem can land in either, so one slot alone isn't reliable.
sackGateSlotA=2
sackGateSlotB=12
