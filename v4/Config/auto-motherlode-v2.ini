[Meta]
schemaVersion=1

[Tunables]
; ============================================================
; Runner + phase timing (global cadence)
; ============================================================
; How often the engine tick loop runs, in ms. Lower = more responsive
; detection/clicking, but more CPU/screen-read overhead. 50ms = 20 ticks/sec.
runnerTickMs=50
; Maximum time (ms) allowed in the "mine" phase with no progress (no
; successful click) before the bot force-stops as stuck. 180000 = 3 minutes.
phaseTimeoutMine=180000
; Same idea as phaseTimeoutMine, but shared by the clearRed and clearYellow
; phases (matches legacy's single phaseTimeoutBank covering both).
phaseTimeoutBank=30000
; Per-phase timeout for withdrawSack/depositBank - kept separate from
; phaseTimeoutBank (not shared) because those phases have their own much
; longer internal wait failsafes (sackWaitTimeoutMs=60000,
; bankImageWaitTimeoutMs=15000 following a click that itself only fires
; after sackReclickCooldownMs=12000 has elapsed). Sharing phaseTimeoutBank
; here would let the engine's generic "phase timed out" stop fire before
; those phases' own more specific timeout messages ever get a chance to -
; this value is set comfortably above the longest internal wait
; (sackWaitTimeoutMs) so the phase's own failsafe always wins first.
phaseTimeoutSack=90000
; Per-phase timeout for returnMine1/returnMine2 - kept separate from the
; other phase timeouts for the same reason as phaseTimeoutSack (own
; internal wait failsafes, own re-click cooldowns), set comfortably above
; the longest internal wait (return1WaitTimeoutMs/return2WaitTimeoutMs).
phaseTimeoutReturn=60000

; ============================================================
; Mine phase (search/click loop) - the only implemented phase so far
; ============================================================
; Per-channel (R/G/B) color match tolerance used by the vein color-block
; search. Higher = more forgiving of lighting/anti-aliasing, but more
; false matches.
colorTolerance=20
; Number of consecutive ticks a found vein position must stay within a few
; pixels of its previous position before it's considered "stable" (i.e.
; the character has arrived and mining has actually started, vs. still
; walking toward it). Affects which click-cadence branch runs.
mineStableTicks=2
; Minimum time (ms) between clicks on a stable, locked-on vein. This is
; the main "how often do we click while mining" throttle - too low wastes
; clicks/looks bot-like, too high risks idling after a vein depletes.
clickCooldownMs=1500
; Pixel offset applied to every click AFTER the found vein block's center
; is computed - the found 15x15 block's center can be a fixed distance
; from the actual clickable ore rock in-game, so this shifts the click to
; land on it. Positive X moves the click right, positive Y moves it down.
veinClickOffsetX=0
veinClickOffsetY=0
; 1 = search for the vein block scanning from the BOTTOM of the search
; region upward (so the first-found pixel, and therefore the computed
; block center, is near the bottom-left of the vein overlay). 0 = default
; top-down scan (first-found pixel near the top-left). Change this if
; clicks consistently land in the green overlay but miss the actual
; clickable ore rock, since that rock's position relative to the overlay
; differs depending on which corner of the overlay is found first.
mineScanBottomUp=0
; While walking to a vein that hasn't yet been clicked as "stable" (see
; mineStableTicks), if this much time (ms) passes since the last click
; with still no stability reached, click again anyway. Without this, a
; vein whose found position keeps jittering slightly between ticks would
; get exactly one click and then never be clicked again - this is a
; failsafe against getting permanently stuck mid-walk.
walkReclickTimeoutMs=3000
; Delay (ms) between moving the mouse to the target and actually sending
; the click - gives the game client a moment to register the cursor being
; over the target (hover/highlight state) before the click fires. Without
; this, a click can register as a plain tile click instead of a proper
; vein interaction, because the client hasn't yet updated what it thinks
; is under the cursor. Matches legacy's HumanClick behavior exactly.
clickSettleMs=100
; Random +/- percent jitter applied to clickSettleMs and ctrlHoldSettleMs
; (capped at 100ms swing, floored at 30ms total) - matches legacy's
; JitterDelay default of 15%.
clickSettleJitterPercent=10
; Delay (ms) after pressing Ctrl (when runMode=1) before releasing it,
; giving the "force run" modifier time to register around the click.
ctrlHoldSettleMs=50
; Vein search region (top-left x1/y1, bottom-right x2/y2) - the screen area
; scanned for the light/dark vein overlay colors. Recalibrate these four if
; the game window moves/resizes or the mining spot changes.
mineRegionX1=1068
mineRegionY1=672
mineRegionX2=1438
mineRegionY2=842
; The two vein overlay colors OSRS renders (light and dark variants of the
; same highlight) - both are searched for every acquire tick, whichever is
; found (or closer to referencePoint if both are) becomes the target.
veinColorLight=0x00FF00
veinColorDark=0x00CE00
; Minimum solid-color block size (px) required for a color match to count
; as a real vein rather than noise. Larger = more certain it's a real vein,
; but the computed click-center point sits further from the first-detected
; pixel, which can miss the actual clickable rock if it lands off-center.
mineBlockW=25
mineBlockH=25
; Fallback reference point (character center) used to pick between two
; simultaneously-visible veins (whichever is closer, by squared distance).
; Not separately calibrated - defaults to screen center, matching legacy.
referencePointX=960
referencePointY=540

; ============================================================
; ClearRed phase (rockfall obstacle clearing, blocks the hopper walkway)
; ============================================================
; Rockfall overlay color, searched across the WHOLE screen (not a fixed
; region - a rockfall can appear anywhere on the upper floor).
redColor=0xFF0000
; Tolerance 0 = exact match only, matching legacy (rockfall overlay is a
; flat, non-anti-aliased color, unlike the vein overlay).
redTolerance=0
; Minimum solid-color block size (px) required to count as a real rockfall.
redBlockW=25
redBlockH=25
; Half-width (px) of the box re-searched around a locked rockfall's last
; position each tick (matches legacy's 400x400 = +/-200 tracking box) -
; wider than the mine phase's tracking box since running toward a rockfall
; across open floor shifts the camera more than mining in place does.
redTrackBoxRadiusPx=200
; Consecutive ticks a found rockfall must stay within a few px of its
; previous position before it's considered "stable" (arrived, now mining
; through it) rather than still being walked toward.
redStableTicks=2
; Minimum time (ms) between clicks on a stable, locked rockfall - long
; because clearing a rockfall takes a while and doesn't need repeated
; clicks the way mining a vein does.
redClearCooldownMs=6000

; ============================================================
; ClearYellow phase (depositing mined ore into the hopper)
; ============================================================
; Ore hopper's color, searched across the WHOLE screen.
yellowColor=0xFFFF00
; Looser tolerance than red - the hopper isn't a flat overlay color like
; the rockfall, so some anti-aliasing tolerance is needed.
yellowTolerance=12
; Minimum solid-color block size (px) required to count as the hopper.
yellowBlockW=22
yellowBlockH=22
; Consecutive ticks required before the hopper position counts as
; "stable" - 0 means the very first found tick is already stable (no
; walking-in debounce needed, unlike the rockfall/vein targets), matching
; legacy exactly.
yellowStableTicks=0
; Minimum time (ms) between clicks on the hopper - deliberately long
; (15s) to give the walk-to-hopper + full inventory-drain deposit
; animation time to finish before clicking again. Legacy hardcoded this
; value and never actually read it from its own equivalent ini key (a
; legacy bug) - v4 reads this key for real.
yellowClickCooldownMs=15000

; ============================================================
; WithdrawSack phase (running to the ore sack and withdrawing)
; ============================================================
; Fixed screen point clicked once to run to/interact with the ore sack -
; no search involved, this is a calibrated, unchanging click target.
sackRunX=1825
sackRunY=724
; Delay (ms) before the very first sack click, giving the hopper-drop
; animation (from the previous clearYellow deposit) time to finish.
sackPreClickDelayMs=200
; Minimum time (ms) between re-clicks of the sack point while waiting for
; the inventory to receive items - a failsafe in case the first click
; didn't register, not a normal click-cadence throttle.
sackReclickCooldownMs=12000
; Maximum time (ms) to wait for the inventory to receive items from the
; sack before giving up and stopping the bot cleanly (rather than waiting
; forever or looping indefinitely on a sack that isn't responding).
sackWaitTimeoutMs=60000

; ============================================================
; DepositBank phase (opening the deposit box and depositing all)
; ============================================================
; Deposit-container overlay color (object-marker-highlighted bank chest),
; searched across the WHOLE screen, same shape as redColor/yellowColor.
bankColor=0xFF00FF
bankTolerance=0
bankBlockW=24
bankBlockH=24
; Delay (ms) before clicking the deposit container, applied once on
; entering this phase - without it, the container can be found and
; clicked instantly (e.g. it's already visible right after leaving the
; sack), before the character has actually started walking toward it.
bankPreClickDelayMs=600
; Calibrated anchor point for the "Deposit All" button image
; (v4/Images/deposit-motherlode.png, 80x72px) - the search region is this
; point padded by bankImageSearchPaddingPx in every direction, matching
; legacy's padded-box approach around its own calibrated image position.
bankImageAnchorX=775
bankImageAnchorY=765
bankImageSearchPaddingPx=20
; Maximum time (ms) to wait for the deposit-box interface (the "Deposit
; All" button image) to appear after clicking the deposit container,
; before giving up and stopping the bot cleanly.
bankImageWaitTimeoutMs=15000
; How often (ms) to re-check for the deposit-box image while waiting -
; an ImageSearch poll interval, not a click cadence.
bankImagePollMs=200

; ============================================================
; ReturnMine1 phase (walking from the bank back toward the mine, step 1)
; ============================================================
; Fixed screen point clicked once on entering this phase - no search
; involved, a calibrated, unchanging click target (minimap waypoint).
return1ClickX=699
return1ClickY=1279
; Orange waypoint-arrival marker searched for in a region padded around
; this point - appears once the character has arrived at this leg's
; destination.
return1MarkerX=1472
return1MarkerY=1028
return1MarkerW=35
return1MarkerH=35
return1MarkerColor=0xFF8700
return1MarkerTolerance=0
; Padding (px) added around the marker point in every direction to build
; the search region - matches the pattern already used by redTrackBoxRadiusPx
; etc., wide enough to tolerate the marker not landing exactly on the
; calibrated pixel.
return1MarkerSearchPaddingPx=50
; Minimum time (ms) between re-clicks of the step-1 point while waiting
; for the marker - a failsafe in case the first click didn't register.
return1ReclickCooldownMs=12000
; Maximum time (ms) to wait for the step-1 marker before giving up and
; stopping the bot cleanly.
return1WaitTimeoutMs=30000

; ============================================================
; ReturnMine2 phase (walking from the bank back toward the mine, step 2
; and the final approach click - two internal stages under one phase)
; ============================================================
; Fixed screen point clicked once entering stage 1.
return2ClickX=1251
return2ClickY=1354
; Orange marker searched for once stage-1 walking should be complete.
return2MarkerX=1416
return2MarkerY=559
return2MarkerW=21
return2MarkerH=21
return2MarkerColor=0xFF8700
return2MarkerTolerance=0
return2MarkerSearchPaddingPx=50
; Minimum time (ms) between re-clicks of the step-2 point while waiting
; for the marker - same failsafe shape as return1ReclickCooldownMs.
return2ReclickCooldownMs=12000
; Maximum time (ms) to wait for the step-2 marker before giving up and
; stopping the bot cleanly.
return2WaitTimeoutMs=30000
; Fixed screen point clicked once on entering stage 2 (the final
; directed click that puts the character on the actual mining spot).
return2FinalClickX=1491
return2FinalClickY=933
; Delay (ms) after the final click before handing off back to the mine
; phase - gives the character time to actually arrive/settle at the vein
; spot before MinePhase starts scanning again.
return2AfterClickWaitMs=1000

[Settings]
; Whether to hold Ctrl (OSRS "force run" click modifier) while clicking.
; 1 = hold Ctrl during clicks, 0 = normal clicks.
runMode=1
; Inventory slot index (1-28) used as the "indicator slot" to infer
; whether the whole inventory is full/empty, instead of scanning all 28
; slots individually. Fast but relies on this slot reliably filling last.
indicatorSlot=28
; Second slot checked alongside indicatorSlot - "full" requires BOTH
; occupied. Needed because Motherlode gems can land in slot 28 without
; ever being swept into the hopper (gems aren't ore), which would make a
; 28-only check report "full" forever after a single gem. Requiring 27
; too means a lone gem in 28 (with 27 still empty) correctly reads as
; not full.
secondaryIndicatorSlot=27
; Two spread-out slots checked with OR logic to detect "the sack gave us
; something" - a gem can appear in any slot, so checking two slots instead
; of one catches more fill patterns than relying on a single slot index.
sackGateSlotA=2
sackGateSlotB=12
