[Meta]
schemaVersion=1

[Tunables]
; ============================================================
; Runner + phase timing (global cadence)
; ============================================================
; Engine tick interval (ms). Lower = more responsive, more CPU.
runnerTickMs=50
; Force-stop if goToFurnace/smelt makes no progress for this long (ms).
phaseTimeoutFurnace=180000
; Force-stop if goToBank/depositAndWithdraw makes no progress for this long (ms).
phaseTimeoutBank=60000

; ============================================================
; Detection tuning shared across phases
; ============================================================
; Per-channel color match tolerance for marker searches.
colorTolerance=20

; ============================================================
; GoToFurnace phase (walk to the furnace marker, start smelting)
; ============================================================
; Magenta furnace marker - fixed point, verified present before click.
furnaceMarkerX=427
furnaceMarkerY=966
furnaceMarkerW=55
furnaceMarkerH=55
furnaceMarkerColor=0xFF00FF
furnaceMarkerTolerance=0
; Padding (px) around the marker point to build the search region.
furnaceMarkerSearchPaddingPx=30
; Min time (ms) between re-clicks while waiting for the marker.
furnaceMarkerReclickCooldownMs=6000
; Max time (ms) to wait for the marker before stopping cleanly.
furnaceMarkerWaitTimeoutMs=30000
; Calibrated anchor for craft-marker-1.png (v4/Images, same dialog image as
; Firemaking) - shown once the "smelt X" dialog is available.
craftMarkerAnchorX=929
craftMarkerAnchorY=1081
; craft-marker-1.png's own pixel dimensions (AHK can't query a PNG's size).
craftMarkerImageW=70
craftMarkerImageH=60
; Padding (px) around the anchor to build the search region.
craftMarkerSearchPaddingPx=20
; Max time (ms) to wait for the dialog before stopping cleanly.
craftMarkerWaitTimeoutMs=15000
; ImageSearch poll interval (ms) while waiting.
craftMarkerPollMs=100

; ============================================================
; Smelt phase (space confirms the dialog, then just waits)
; ============================================================
; Delay (ms) after pressing space before this phase starts polling for an
; empty inventory - lets the dialog actually close/register.
spacePressSettleMs=100
; Indicator slot used to infer inventory empty (last slot filled last).
smeltIndicatorSlot=25

; ============================================================
; GoToBank phase (walk to the bank booth, confirm it's open)
; ============================================================
; Blue bank-booth marker - fixed point, verified present before click.
bankMarkerX=1774
bankMarkerY=405
bankMarkerW=41
bankMarkerH=41
bankMarkerColor=0x0000FF
bankMarkerTolerance=0
bankMarkerSearchPaddingPx=30
; Min time (ms) between re-clicks while waiting for the marker.
bankMarkerReclickCooldownMs=6000
; Max time (ms) to wait for the marker before stopping cleanly.
bankMarkerWaitTimeoutMs=30000
; Calibrated anchor for deposit-default.png (v4/Images, same image/coords as
; Firemaking) - clicked directly (deposit-all), unlike Firemaking where this
; image is only a detection signal.
bankOpenAnchorX=1327
bankOpenAnchorY=963
; deposit-default.png's own pixel dimensions (AHK can't query a PNG's size).
bankOpenImageW=72
bankOpenImageH=72
bankOpenSearchPaddingPx=20
; Max time (ms) to wait for the bank interface before stopping cleanly.
bankOpenWaitTimeoutMs=15000
; ImageSearch poll interval (ms) while waiting.
bankOpenPollMs=100

; ============================================================
; DepositAndWithdraw phase (deposit ingots, withdraw a multi-slot
; plan, settle, restart the loop)
; ============================================================
; Bank slot 1's top-left corner; one row of slots at bankSlotPitchX spacing
; (72px cell width + 24px gap = 96px pitch, same calibration as Firemaking).
bankSlotFirstX=625
bankSlotFirstY=203
bankSlotPitchX=96
bankSlotW=72
bankSlotH=64
; How many slot/click-count pairs are active below (generalizes to N slots).
withdrawSlotCount=2
; Slot 1: index + how many times to click it.
withdrawSlot1Index=1
withdrawSlot1Clicks=4
; Slot 2: index + how many times to click it.
withdrawSlot2Index=2
withdrawSlot2Clicks=1
; Delay (ms) after withdrawing before searching for the furnace marker again -
; without this the search can fire before the client finishes settling
; post-withdraw (character/camera still catching up), same bug class fixed
; repeatedly in Motherlode/Firemaking. Tune this live.
postWithdrawSettleDelayMs=100
; Min delay (ms) between repeated clicks on the same slot (a plain click
; cadence, not a re-detection cooldown).
withdrawClickIntervalMs=100

; ============================================================
; Click execution (shared by every phase's click helper)
; ============================================================
; Delay (ms) between mouse-move and click - lets the client register
; hover before the click fires.
clickSettleMs=100
; +/- percent jitter on clickSettleMs/ctrlHoldSettleMs (capped 100ms,
; floored 30ms).
clickSettleJitterPercent=0
; Delay (ms) after pressing Ctrl (runMode=1) before releasing it.
ctrlHoldSettleMs=100

[Settings]
; Hold Ctrl (force-run) while clicking. 1 = on, 0 = off.
runMode=1
