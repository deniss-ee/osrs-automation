[Meta]
schemaVersion=1

[Tunables]
; ============================================================
; Runner + phase timing (global cadence)
; ============================================================
; Engine tick interval (ms). Lower = more responsive, more CPU.
runnerTickMs=50
; Force-stop if chopWood makes no progress for this long (ms).
phaseTimeoutChopWood=180000
; Force-stop if depositBank makes no progress for this long (ms).
phaseTimeoutBank=60000

; ============================================================
; Detection tuning shared across phases
; ============================================================
colorTolerance=20
targetLockMoveTolerancePx=8

; ============================================================
; ChopWood phase: full-screen search for the tree overlay block,
; acquire/track/depleted/re-acquire loop.
; ============================================================
treeColor=0x00FF00
treeBlockW=73
treeBlockH=73
; Vertical scan order for the full-screen tree search.
; 0 = top-down, 1 = bottom-up.
treeScanBottomUp=0
; Radius (px) of the narrowed re-search box around the last known
; tree position while tracking.
treeTrackBoxRadiusPx=150
; Consecutive stable ticks required before TargetLock.IsStable().
treeStableTicks=3
; Minimum time (ms) between repeat clicks on a stable, locked tree.
treeClickCooldownMs=2000
; Re-click timeout (ms) while the tree hasn't stabilized yet
; (character still walking toward it).
treeWalkReclickTimeoutMs=3000

; ============================================================
; DepositBank phase: full-screen search for the deposit-bank
; marker, click it, wait for the deposit interface, deposit all,
; then click a fixed post-deposit point and settle.
; ============================================================
bankColor=0xFF00FF
bankBlockW=21
bankBlockH=21
bankTolerance=20
; Vertical scan order for the full-screen bank search.
; 0 = top-down, 1 = bottom-up.
bankScanBottomUp=1
; Calibrated anchor for the deposit-open image - deposit interface is
; identical to Motherlode's, so these values (and Images/deposit-motherlode.png,
; 80x72px) are reused as-is from Config/auto-motherlode-v2.ini.
bankImageAnchorX=775
bankImageAnchorY=765
bankImageW=80
bankImageH=72
bankImageSearchPaddingPx=20
bankImageWaitTimeoutMs=15000
bankImagePollMs=200
; Fixed post-deposit click point.
postDepositClickX=1652
postDepositClickY=842
; Settle wait (ms) after the post-deposit click, before resuming
; chopWood.
postDepositSettleMs=3000

; ============================================================
; Click execution (shared by every phase's click helper)
; ============================================================
; Delay (ms) between mouse-move and click - lets the client register
; hover before the click fires.
clickSettleMs=100
; +/- percent jitter on clickSettleMs/ctrlHoldSettleMs (capped 100ms,
; floored 30ms).
clickSettleJitterPercent=0
; Delay (ms) after pressing Ctrl (runMode=1) before releasing it.
ctrlHoldSettleMs=100

[Settings]
; Hold Ctrl (force-run) while clicking. 1 = on, 0 = off.
runMode=1
; Last inventory slot - occupied once the last chop lands.
indicatorSlot=28
