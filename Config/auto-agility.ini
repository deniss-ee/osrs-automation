[Meta]
schemaVersion=1

[Settings]
; Hold Ctrl (force-run) while clicking. 1 = on, 0 = off.
runMode=1
; Number of obstacle steps in this course - the bot reads exactly this
; many [Step:N] sections (1..stepCount) and stepSearchPollNMs keys.
; Change this (and add/remove matching sections/keys together) to adapt
; the bot to a different agility course.
stepCount=8

[Tunables]
; ============================================================
; Runner + phase timing (global cadence)
; ============================================================
; Engine tick interval (ms). Lower = more responsive, more CPU.
runnerTickMs=50
; Force-stop if the agility phase makes no progress for this long (ms).
phaseTimeoutAgility=30000

; ============================================================
; Obstacle steps - find current step's exact highlight block, click,
; advance. One [Step:N] section per obstacle (N = 1..stepCount, see
; [Settings] above), each paired with its own stepSearchPollNMs poll
; interval directly below it - grouped together since they describe the
; same step.
;
; colorTolerance: +/- tolerance per color channel when matching each
; step's highlight color (and the fall-recovery block's color).
; stepSearchDelayMs: settle delay (ms) after clicking a step, before the
; next tick starts searching for the following step's highlight.
; ============================================================
colorTolerance=10
stepSearchDelayMs=10

; [Step:1] - w/h: exact pixel size of the highlighted obstacle block.
; x/y: exact pixel CENTER of the highlighted obstacle block (no search
; padding is added - keep these measurements precise). color: the
; obstacle's highlight color as 0xRRGGBB, matched within
; +/-colorTolerance per channel. Every step's color should be UNIQUE
; across the whole course - this is what lets the bot re-find the
; correct step by color alone (whole-screen search) after a Mark of
; Grace detour, with no ambiguity against any other step.
; stepSearchPoll1Ms: poll interval (ms) while waiting for step 1's
; highlight to appear - each step gets its own, since each obstacle's
; traversal/animation takes a different amount of real-world time.
[Step:1]
w=104
h=88
x=938
y=687
color=0xE7FFE4
stepSearchPoll1Ms=2800

