; ============================================================
; Fall recovery - only checked while stuck waiting for the marker of
; afterStep + 1 (falling off the course is known to happen after a
; specific step). If the NEXT step's own highlight isn't found, this
; block is searched for; if found, the bot waits fallRecoveryDelayMs
; then clicks it, and the course resets to step 1.
;
; enabled: 1 to check for this block, 0 to disable fall recovery
; entirely (e.g. for a course with no known fall point).
; afterStep/w/h/x/y/color: same meaning as a [Step:N] block above - the
; "back on solid ground" marker's step-after, exact size/position/color.
; fallRecoveryDelayMs: wait (ms) after detecting the block, before
; clicking it - was previously an instant click with no delay at all,
; which was too fast; 800 = ~8x the normal stepSearchDelayMs.
; ============================================================
[FallRecovery]
enabled=1
afterStep=3
w=30
h=22
x=1499
y=67
color=0xFFFF00
fallRecoveryDelayMs=2000

; ============================================================
; Mark of Grace detection + pickup confirmation - every tick, before
; touching the current step's obstacle coordinates, search the whole
; screen for the reference image below; if found, click it and confirm
; the pickup via the item-count box.
;
; imageW/imageH: Images/mog-item.png's own actual pixel dimensions (AHK
; has no way to query an image file's size, so it's supplied explicitly).
; mogShadeTolerance: ImageSearch shade-variation tolerance (0-255) - a
; live capture is rarely pixel-identical to the reference image.
; graceClickOffsetY: Y offset (px) applied to the found image's center
; before clicking.
; gracePrePickupDelayMs: brief pause (ms) before checking for Mark of
; Grace, once per step - not a settle window, just avoids searching in
; the exact same instant the obstacle highlight was found.
; slotSignatureX/Y/W/H: small fixed pixel box that visibly changes once
; a Mark of Grace lands in the inventory (the item-count area of slot
; 1) - used to confirm a pickup actually happened, not just that a
; click occurred.
; gracePickupTimeoutMs: max time (ms) to wait for the item-count box to
; change after clicking a Mark of Grace before giving up on that pickup.
; graceConfirmPollMs: poll interval (ms) while waiting for the
; item-count box to change.
; gracePickedUpDelayMs: brief settle (ms) after a CONFIRMED pickup only
; (inventory just changed) before checking for another mark / moving on
; - NOT applied on a timed-out pickup, since nothing changed there to
; settle from.
; dynamicSearchBlockSizePx: block size (px, square) used when searching
; for the current step's own color after a Mark of Grace detour - the
; step's own calibrated w/h may no longer match once the camera/position
; has shifted, so a smaller fixed size is used instead.
; dynamicSearchWidthPx/dynamicSearchHeightPx: size of the bounded window
; (centered on the step's own position) searched in dynamic mode -
; NOT the whole screen, since a common highlight color (e.g. pure green,
; shared with lots of outdoor scenery) makes a whole-screen scan
; expensive (every false-positive pixel costs another verify cycle).
; Big enough to comfortably cover a realistic mark-detour distance,
; small enough to sharply cut false candidates versus the whole screen.
; ============================================================
[MarkOfGrace]
imageW=134
imageH=22
mogShadeTolerance=20
graceClickOffsetY=6
gracePrePickupDelayMs=100
slotSignatureX=2115
slotSignatureY=801
slotSignatureW=10
slotSignatureH=16
gracePickupTimeoutMs=2800
graceConfirmPollMs=100
gracePickedUpDelayMs=200
dynamicSearchBlockSizePx=32
dynamicSearchWidthPx=1024
dynamicSearchHeightPx=576

[ClickExecution]
; ============================================================
; Click execution (shared by every phase's click helper)
; ============================================================
; Delay (ms) between mouse-move and click - lets the client register
; hover before the click fires.
clickSettleMs=100
; +/- percent jitter on clickSettleMs/ctrlHoldSettleMs (capped 100ms,
; floored 30ms).
clickSettleJitterPercent=0
; Delay (ms) after pressing Ctrl (runMode=1) before releasing it.
ctrlHoldSettleMs=100
