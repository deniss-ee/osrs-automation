[Meta]
schemaVersion=1

[Tunables]
; ============================================================
; Runner + phase timing (global cadence)
; ============================================================
; Engine tick interval (ms). Lower = more responsive, more CPU.
runnerTickMs=50
; Force-stop if the agility phase makes no progress for this long (ms).
phaseTimeoutAgility=60000

; ============================================================
; AgilityPhase (find current step's exact highlight block, click,
; advance)
; ============================================================
; +/- tolerance per color channel when matching each step's highlight
; color (and the fall-recovery block's color).
colorTolerance=1
; Settle delay (ms) after clicking a step, before the next tick
; starts searching for the following step's highlight.
stepSearchDelayMs=100

; Poll interval (ms) while waiting for each step's highlight to
; appear - one per step, since each obstacle's traversal/animation
; takes a different amount of real-world time. stepCount below
; controls how many of these are actually read; add/remove
; stepSearchPollNMs keys (and matching [Step:N] sections) together
; when changing stepCount for a different course.
stepSearchPoll1Ms=1000
stepSearchPoll2Ms=2000
stepSearchPoll3Ms=800
stepSearchPoll4Ms=800
stepSearchPoll5Ms=1200
stepSearchPoll6Ms=2000
stepSearchPoll7Ms=1800
stepSearchPoll8Ms=1000

; ============================================================
; Mark of Grace detection + pickup confirmation
; ============================================================
; Settle delay (ms) before searching for Mark of Grace, once per step.
gracePrePickupDelayMs=500
; Settle delay (ms) after a pickup attempt (confirmed or timed out)
; before re-checking for another Mark of Grace on screen.
gracePostPickupDelayMs=1500
; Max time (ms) to wait for the item-count box to change after clicking
; a Mark of Grace before giving up on that pickup.
gracePickupTimeoutMs=2000
; Poll interval (ms) while waiting for the item-count box to change.
graceConfirmPollMs=100
; Block size (px, square) used when searching the WHOLE screen for the
; current step's own color after a Mark of Grace detour - the step's
; own calibrated w/h may no longer match once the camera/position has
; shifted, so a smaller fixed size is used instead.
dynamicSearchBlockSizePx=32
; ImageSearch shade-variation tolerance (0-255) for mog-item.png - a
; live capture is rarely pixel-identical to the reference image.
mogShadeTolerance=20
; Y offset (px) applied to the found Mark of Grace image's center before
; clicking.
graceClickOffsetY=8

; ============================================================
; Click execution (shared by every phase's click helper)
; ============================================================
; Delay (ms) between mouse-move and click - lets the client register
; hover before the click fires.
clickSettleMs=100
; +/- percent jitter on clickSettleMs/ctrlHoldSettleMs (capped 100ms,
; floored 30ms).
clickSettleJitterPercent=10
; Delay (ms) after pressing Ctrl (runMode=1) before releasing it.
ctrlHoldSettleMs=100

[Settings]
; Hold Ctrl (force-run) while clicking. 1 = on, 0 = off.
runMode=1
; Number of obstacle steps in this course - the bot reads exactly this
; many [Step:N] sections (1..stepCount) and stepSearchPollNMs keys.
; Change this (and add/remove matching sections above/below) to adapt
; the bot to a different agility course.
stepCount=8

; ============================================================
; Obstacle steps - one [Step:N] section per obstacle, N = 1..stepCount
; (see [Settings] stepCount above). Each step's highlight color should
; be UNIQUE across all steps in the course - this is what lets the bot
; re-find the correct step by color alone (whole-screen search) after
; a Mark of Grace detour, with no ambiguity against any other step.
;
; w/h: exact pixel size of the highlighted obstacle block.
; x/y: exact pixel CENTER of the highlighted obstacle block (no search
;      padding is added - keep these measurements precise).
; color: the obstacle's highlight color as 0xRRGGBB, matched within
;        +/-colorTolerance (see [Tunables] above) per channel.
; ============================================================
[Step:1]
w=104
h=88
x=938
y=687
color=0xE7FFE4

[Step:2]
w=96
h=54
x=1199
y=930
color=0xC9FFC4

[Step:3]
w=102
h=52
x=1447
y=984
color=0x98FF90

[Step:4]
w=88
h=50
x=1527
y=728
color=0x56FF50

[Step:5]
w=44
h=48
x=1348
y=620
color=0x00FF00

[Step:6]
w=66
h=40
x=1216
y=266
color=0x00E606

[Step:7]
w=56
h=42
x=919
y=696
color=0x00B809

[Step:8]
w=52
h=40
x=1031
y=781
color=0xFFFF00

; ============================================================
; Fall recovery - only checked while stuck waiting for the marker of
; fallRecoveryAfterStep + 1 (falling off the course is known to happen
; after a specific step - set fallRecoveryAfterStep to that step's
; number). If the NEXT step's own highlight isn't found, this block is
; searched for; if found, it's clicked and the course resets to step 1.
;
; w/h/x/y/color: same meaning as a [Step:N] block above - the "back on
; solid ground" marker's exact size/position/color.
; enabled: 1 to check for this block, 0 to disable fall recovery
; entirely (e.g. for a course with no known fall point).
; ============================================================
[FallRecovery]
enabled=1
afterStep=3
w=30
h=22
x=1499
y=67
color=0xFFFF00

; ============================================================
; Mark of Grace image reference (Images/mog-item.png) - imageW/imageH
; must match the PNG's own actual pixel dimensions (AHK has no way to
; query an image file's size, so it's supplied here explicitly).
; ============================================================
[MarkOfGrace]
imageW=134
imageH=22
; Small fixed pixel box that visibly changes once a Mark of Grace lands
; in the inventory (the item-count area of slot 1) - used to confirm a
; pickup actually happened, not just that a click occurred.
slotSignatureX=2101
slotSignatureY=801
slotSignatureW=10
slotSignatureH=16
