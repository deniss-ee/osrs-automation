[Meta]
schemaVersion=1

[Tunables]
; ============================================================
; Runner + phase timing (global cadence)
; ============================================================
; Engine tick interval (ms). Lower = more responsive, more CPU.
runnerTickMs=50
; Force-stop if scanAndAttack makes no progress for this long (ms).
phaseTimeoutScan=60000
; Force-stop if waitCombat makes no progress for this long (ms).
phaseTimeoutCombat=60000
; Force-stop if lootPickup makes no progress for this long (ms). Note:
; the loot stages themselves never call engine.Stop on their own
; image-search timeouts (they skip back to scanAndAttack instead) - this
; is only a true "nothing is happening at all" outer safety net.
phaseTimeoutLoot=60000

; ============================================================
; ScanAndAttack phase (find nearest NPC blob, click it) - identical
; tuning to the original AutoFighter bot.
; ============================================================
targetColor=0xFF00FF
targetColorTolerance=20
targetBlobRadius=33
targetSampleRate=10
targetSeedRowStep=10
refPointX=1049
refPointY=502
targetSearchRadiusX=500
targetSearchRadiusY=500
scanPollMs=100
targetWaitTimeoutMs=30000

; ============================================================
; WaitCombat phase (poll the HP-bar indicator pixel) - identical
; tuning to the original AutoFighter bot.
; ============================================================
combatIndicatorX=2135
combatIndicatorY=1265
combatIndicatorTolerance=20
combatStartColor=0x078A36
combatKillColor=0x631413
combatPollMs=100
retryClickAfterMs=2600
combatStartTimeoutMs=10000
postKillSettleDelayMs=100

; ============================================================
; LootPickup phase (right-click bb-item.png, click take-bb.png,
; then click inventory slot 1)
; ============================================================
; Delay (ms) after a confirmed kill before searching for the dropped
; item - lets the death animation/item drop settle.
postKillLootDelayMs=3300
; Search region for bb-item.png: a widthxheight box centered on this
; point (defaults to the same reference point as scanAndAttack).
lootSearchCenterX=1249
lootSearchCenterY=702
lootSearchWidth=2560
lootSearchHeight=1440
; bb-item.png (94x22px) uses #00FF00 as its transparent-background
; marker color - ImageSearch is told to ignore that color via the
; *Trans0x00FF00 option, or it would try to match those pixels literally
; against the real (non-green) game background and likely never find it.
bbItemPollMs=100
bbItemWaitTimeoutMs=10000
; take-bb.png (194x30px) is itself the context-menu option to click
; after right-clicking bb-item.png - no separate menu-position click.
takeBbPollMs=100
takeBbWaitTimeoutMs=10000
; Delay (ms) after clicking take-bb.png before clicking inventory slot 1.
postTakeDelayMs=1400

; ============================================================
; Click execution (shared by every phase's click helper)
; ============================================================
; Delay (ms) between mouse-move and click - lets the client register
; hover before the click fires.
clickSettleMs=100
; +/- percent jitter on clickSettleMs/ctrlHoldSettleMs (capped 100ms,
; floored 30ms).
clickSettleJitterPercent=0
; Delay (ms) after pressing Ctrl (runMode=1) before releasing it.
ctrlHoldSettleMs=100

[Settings]
; Hold Ctrl (force-run) while clicking. 1 = on, 0 = off.
runMode=1
