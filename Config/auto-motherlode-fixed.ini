[Meta]
schemaVersion=1

[Tunables]
; ============================================================
; Runner + phase timing (global cadence)
; ============================================================
; Engine tick interval (ms). Lower = more responsive, more CPU.
runnerTickMs=50
; Force-stop if "mine" makes no progress for this long (ms).
phaseTimeoutMine=180000
; Force-stop if "depositBank" makes no progress for this long (ms).
phaseTimeoutBank=30000
; Force-stop if "returnToMine" makes no progress for this long (ms).
phaseTimeoutReturn=30000

; ============================================================
; Mine phase (two fixed-position veins, no walking/searching)
; ============================================================
; Per-channel color match tolerance for both vein checks.
veinTolerance=20
; Vein A - fixed point + color + min solid block size.
veinAX=1198
veinAY=697
veinAColor=0x00FF00
veinBlockW=23
veinBlockH=23
; Vein B - fixed point + color + min solid block size (same block size
; as vein A per calibration).
veinBX=1240
veinBY=740
veinBColor=0x009B00

; ============================================================
; DepositBank phase (deposit box marker + "Deposit All" image)
; ============================================================
; Deposit-container marker color + fixed point (character never moves
; from the mining tile, so this is a small padded region, not full-screen).
depositColor=0xFF00FF
depositTolerance=0
depositBlockW=27
depositBlockH=27
depositMarkerX=996
depositMarkerY=507
; Padding (px) around the fixed point to build the search region.
depositSearchPaddingPx=20
; One-time delay (ms) before searching for the deposit marker.
depositPreClickDelayMs=100
; Calibrated anchor for the "Deposit All" button image
; (Images/deposit-motherlode.png, 80x72px), padded by
; depositImageSearchPaddingPx to build the search region.
depositImageAnchorX=775
depositImageAnchorY=765
depositImageSearchPaddingPx=20
; Max time (ms) to wait for the deposit box to appear before stopping
; cleanly.
depositImageWaitTimeoutMs=15000
; ImageSearch poll interval (ms) while waiting.
depositImagePollMs=100

; ============================================================
; ReturnToMine phase (one click back to the mining tile)
; ============================================================
; Fixed return click point - may need recalibrating later.
returnClickX=1448
returnClickY=916
; Poll interval (ms) while waiting for a vein to reappear.
returnVeinPollMs=100
; Max time (ms) to wait for a vein to reappear before stopping cleanly.
returnWaitTimeoutMs=30000

; ============================================================
; Click execution (shared by every phase's ClickSettled call)
; ============================================================
; Delay (ms) between mouse-move and click - lets the client register
; hover before the click fires.
clickSettleMs=100
; +/- percent jitter on clickSettleMs/ctrlHoldSettleMs.
clickSettleJitterPercent=10
; Delay (ms) after pressing Ctrl (runMode=1) before releasing it.
ctrlHoldSettleMs=100

[Settings]
; Hold Ctrl (force-run) while clicking. 1 = on, 0 = off.
runMode=1
; Indicator slot used to infer inventory full/empty. Slot 28 alone is
; enough here (unlike the original hopper-based Motherlode bot) - this
; bot deposits everything into a bank-style deposit box, which accepts
; any item, so there's no "gem the container won't take" case to guard
; against with a second slot.
indicatorSlot=28
