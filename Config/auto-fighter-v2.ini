[Meta]
schemaVersion=1

[Tunables]
; ============================================================
; Runner + phase timing (global cadence)
; ============================================================
; Engine tick interval (ms). Lower = more responsive, more CPU.
runnerTickMs=50
; Force-stop if scanAndAttack makes no progress for this long (ms).
phaseTimeoutScan=60000
; Force-stop if waitCombat makes no progress for this long (ms).
phaseTimeoutCombat=60000

; ============================================================
; ScanAndAttack phase (find nearest NPC blob, click it)
; ============================================================
; Magenta NPC-overlay color - irregular, variably-sized blobs, not a
; solid fixed-size block (unlike every other bot's fixed marker).
targetColor=0xFF00FF
targetColorTolerance=20
; How far (px) around the nearest seed pixel to search for the rest of
; that blob's pixels when computing its centroid. The seed can land near a
; blob's edge (not its middle), so this needs to be wide enough to capture
; the WHOLE blob on both sides of the seed - too narrow biases the centroid
; toward the edge the seed happened to land on. Tune live if clicks still
; land near an edge (raise it) or start drifting onto a neighboring NPC
; (lower it).
targetBlobRadius=48
; Row stride for the centroid scan's box. Lowered now that the seed search
; itself is scoped to a small region (see targetSearchRadiusX/Y below) -
; blobs are 35-40+ px tall, so this still samples several rows per blob
; while landing the centroid more precisely than the old full-screen-era
; value of 24.
targetSampleRate=10
; Row stride for the seed search WITHIN the bounded search box (see
; targetSearchRadiusX/Y) - measured live at ~7ms per PixelSearch call, so
; scanning a small box at a fine stride costs about the same total time as
; the old full-screen scan at a coarse stride, but lands far more
; precisely on typical 35-40px-tall blobs. Tune live: lower if blobs are
; still missed, raise if scans feel slow.
targetSeedRowStep=10
; Reference point ("character center") used to pick the NEAREST blob when
; several NPCs are on screen at once. Calibrated: exact center, 2x2px.
refPointX=1249
refPointY=702
; Half-width/half-height (px) of the box scanned around (refPointX,
; refPointY) - NOT the whole screen. "Nearest to ref" rarely picks a
; faraway match anyway, and a smaller region means far fewer PixelSearch
; calls at the same rowStep, buying back precision without paying a
; full-screen scan's latency. Tune live: shrink if the pen is smaller than
; this, grow if targets near the pen's edges are being missed.
targetSearchRadiusX=400
targetSearchRadiusY=400
; Poll interval (ms) between scan attempts when nothing is found yet -
; lowered now that a single scan is faster/more reliable, so a miss
; recovers quicker instead of adding perceptible lag.
scanPollMs=100
; Max time (ms) to wait for a target before stopping cleanly.
targetWaitTimeoutMs=30000

; ============================================================
; WaitCombat phase (poll the HP-bar indicator pixel)
; ============================================================
; 1x1 combat-indicator point - green while fighting, dark red on a kill.
combatIndicatorX=2135
combatIndicatorY=1265
combatIndicatorTolerance=20
combatStartColor=0x078A36
combatKillColor=0x631413
; Poll interval (ms) while waiting on the indicator pixel.
combatPollMs=100
; If combat hasn't STARTED (startColor observed) within this long (ms)
; after the attack click, the click likely missed the moving/irregular
; blob - go back and retry the scan+click instead of continuing to wait
; it out. Measured live: killColor can linger up to ~3s after a kill
; (death animation) before the indicator clears/goes idle - keep this
; comfortably above that, or a real fight-in-progress gets mistaken for
; a missed click and interrupted.
retryClickAfterMs=4000
; Max time (ms) to wait for ANY indicator signal after the attack click
; before assuming something is more seriously wrong - stops cleanly. Must
; be greater than retryClickAfterMs (several retries happen before this).
combatStartTimeoutMs=10000
; Delay (ms) after a confirmed kill before rescanning for the next target -
; lets the death animation/loot drop settle. Tune this live.
postKillSettleDelayMs=100

; ============================================================
; Click execution (shared by every phase's click helper)
; ============================================================
; Delay (ms) between mouse-move and click - lets the client register
; hover before the click fires.
clickSettleMs=100
; +/- percent jitter on clickSettleMs/ctrlHoldSettleMs (capped 100ms,
; floored 30ms).
clickSettleJitterPercent=0
; Delay (ms) after pressing Ctrl (runMode=1) before releasing it.
ctrlHoldSettleMs=100

[Settings]
; Hold Ctrl (force-run) while clicking. 1 = on, 0 = off.
runMode=1
