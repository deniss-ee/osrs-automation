[Meta]
schemaVersion=1

[Settings]
; Hold Ctrl (force-run) while clicking. 1 = on, 0 = off.
runMode=0

[Tunables]
; ============================================================
; Runner + phase timing (global cadence)
; ============================================================
; Engine tick interval (ms). Lower = more responsive, more CPU.
runnerTickMs=50
; Force-stop if thieving makes no progress for this long (ms).
phaseTimeoutThieving=60000
; Force-stop if waitCombat makes no progress for this long (ms).
phaseTimeoutCombat=60000
; Shared color-match tolerance (0-255 per channel) used for both the
; stall's ready-pixel check and the SlotGate empty-background check.
colorTolerance=20

[Stall]
; ============================================================
; Thieving: the stall's #00FF00 ready-pixel. Click it once whenever
; this pixel shows the ready color.
; ============================================================
stallX=1251
stallY=683
stallColor=0x00FF00
; Poll interval (ms) while waiting for the stall to become ready, and
; the settle delay after a successful loot-slot click before searching
; for the ready-pixel again.
stallPollMs=200

[Loot]
; ============================================================
; Loot confirmation: wait for inventory slot 1 to become occupied
; after clicking the stall.
; ============================================================
; Max time (ms) to wait for slot 1 to fill before assuming the theft
; was detected and an NPC is coming to fight.
lootWaitTimeoutMs=2000
; Poll interval (ms) while waiting for slot 1 to fill.
lootPollMs=200

[Combat]
; ============================================================
; WaitCombat phase (poll the HP-bar indicator pixel) - same
; indicator/colors as Bots/AutoFighter, since it's the same underlying
; game combat overlay.
; ============================================================
; 1x1 combat-indicator point - green while fighting, dark red on a kill.
combatIndicatorX=2135
combatIndicatorY=1265
combatIndicatorTolerance=20
combatStartColor=0x078A36
combatKillColor=0x631413
; Poll interval (ms) while waiting on the indicator pixel.
combatPollMs=200
; If combat hasn't STARTED (startColor observed) within this long (ms)
; after entering waitCombat, go back to thieving and re-check stall/
; loot state (no attack click needed - the NPC auto-attacks once it
; reaches the player).
retryClickAfterMs=4000
; Max time (ms) to wait for ANY indicator signal before assuming
; something is more seriously wrong - stops cleanly.
combatStartTimeoutMs=10000
; Delay (ms) after a confirmed kill before resuming thieving (step 2).
postKillSettleDelayMs=6000

[ClickExecution]
; ============================================================
; Click execution (shared by every phase's click helper)
; ============================================================
; Delay (ms) between mouse-move and click - lets the client register
; hover before the click fires.
clickSettleMs=200
; +/- percent jitter on clickSettleMs/ctrlHoldSettleMs (capped 100ms,
; floored 30ms).
clickSettleJitterPercent=0
; Delay (ms) after pressing Ctrl (runMode=1) before releasing it.
ctrlHoldSettleMs=100
